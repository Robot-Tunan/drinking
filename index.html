<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>这次该谁喝 - 聚会幸运转盘</title>
    <style>
        :root {
            --primary-color: #e74c3c;
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        
        /* 核心自适应居中容器 */
        .page-view {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }

        .page-title {
            margin: 0 0 25px 0;
            color: #ff7675;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* 转盘自适应外壳 */
        .wheel-container {
            position: relative;
            width: 85vw;
            height: 85vw;
            max-width: 480px;
            max-height: 480px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            background-color: transparent;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 10px #2d2d2d;
            display: block;
        }

        .spin-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 76px;
            height: 76px;
            background: radial-gradient(circle, #e74c3c, #c0392b);
            border: 4px solid #ffffff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .spin-button::after {
            content: '';
            position: absolute;
            bottom: 92%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 16px 10px;
            border-style: solid;
            border-color: transparent transparent #ffffff transparent;
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes zoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            color: #74b9ff;
            font-size: 18px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .modal-result {
            font-size: 28px;
            font-weight: bold;
            color: #ff7675;
            margin: 20px 0 30px 0;
            line-height: 1.4;
            word-break: break-all;
        }

        .modal-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }
    </style>
</head>
<body>

    <div class="page-view">
        <div class="page-title" id="mainTitle">酒桌大转盘</div>
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="1000" height="1000"></canvas>
            <div class="spin-button" id="spinBtn">抽</div>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-title">━ 惩罚结果 ━</div>
            <div class="modal-result" id="resultText">加载中...</div>
            <button class="modal-btn" onclick="closeModal()">收下惩罚</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        const colors = ["#e74c3c", "#34495e", "#9b59b6", "#16a085", "#27ae60", "#2980b9", "#f1c40f", "#e67e22"];
        let wheelData = { options: [], drawnOptions: [], title: "", duration: 4, noRepeat: false };
        let currentRotation = 0;
        let isSpinning = false;

        let canvas;
        let ctx;
        let mainTitle;

        // 强力防抢跑机制
        window.onload = function() {
            init();
        };

        function init() {
            canvas = document.getElementById('wheelCanvas');
            mainTitle = document.getElementById('mainTitle');
            if (!canvas) return;
            
            ctx = canvas.getContext('2d');
            socket = io();

            document.getElementById('spinBtn').addEventListener('click', spin);

            socket.on('initData', (data) => {
                wheelData = data;
                updateWheelUI();
            });

            socket.on('syncData', (data) => {
                wheelData = data;
                updateWheelUI();
            });

            window.addEventListener('resize', updateWheelUI);
        }

        function saveData() {
            if (socket) socket.emit('updateData', wheelData);
        }

        function getActiveOptions() {
            if (!wheelData || !wheelData.options) return [];
            if (!wheelData.noRepeat) return wheelData.options;
            const drawn = wheelData.drawnOptions || [];
            return wheelData.options.filter(opt => !drawn.includes(opt));
        }

        function updateWheelUI() {
            if (mainTitle && wheelData) mainTitle.innerText = wheelData.title || '自定义转盘';
            drawWheel();
        }

        function drawWheel() {
            if (!ctx || !canvas) return;
            const activeOptions = getActiveOptions();
            const numOptions = activeOptions.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (numOptions === 0) {
                ctx.beginPath();
                ctx.fillStyle = "#333";
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ff7675";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("暂无可用选项，请在后台配置", centerX, centerY);
                return;
            }

            const arc = Math.PI * 2 / numOptions;
            let fontSize = 36;
            if (numOptions > 60) fontSize = 13;
            else if (numOptions > 40) fontSize = 16;
            else if (numOptions > 20) fontSize = 22;
            else if (numOptions > 10) fontSize = 28;

            for (let i = 0; i < numOptions; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                
                ctx.strokeStyle = "rgba(255,255,255,0.15)";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#ffffff";
                ctx.font = `bold ${fontSize}px Arial`;
                
                let text = activeOptions[i];
                if (numOptions > 40 && text.length > 7) {
                    text = text.substring(0, 6) + "..";
                }
                ctx.fillText(text, radius - 35, 0); 
                ctx.restore();
            }
        }

        function spin() {
            if (isSpinning) return;
            let activeOptions = getActiveOptions();
            
            if (wheelData.noRepeat && activeOptions.length === 0) {
                alert("规则池已抽空，已自动重置！");
                wheelData.drawnOptions = [];
                saveData();
                updateWheelUI();
                activeOptions = getActiveOptions();
            }

            if (activeOptions.length === 0) {
                alert("规则库为空，请先前往后台添加规则！");
                return;
            }

            isSpinning = true;
            const durationSec = wheelData.duration || 4;
            const randomDegree = Math.floor(Math.random() * 360);
            const extraSpins = durationSec * 360 * 2; 
            
            currentRotation += extraSpins + randomDegree;
            canvas.style.transition = `transform ${durationSec}s cubic-bezier(0.1, 0.8, 0.1, 1)`;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                calculateWinner();
            }, durationSec * 1000);
        }

        function calculateWinner() {
            const activeOptions = getActiveOptions();
            if (activeOptions.length === 0) return;
            
            const degreesPerSlice = 360 / activeOptions.length;
            const normalizedRotation = currentRotation % 360;
            const winningAngle = (270 - normalizedRotation + 360) % 360;
            const winningIndex = Math.floor(winningAngle / degreesPerSlice) % activeOptions.length;
            const winner = activeOptions[winningIndex];

            if (wheelData.noRepeat) {
                if (!wheelData.drawnOptions) wheelData.drawnOptions = [];
                if (!wheelData.drawnOptions.includes(winner)) {
                    wheelData.drawnOptions.push(winner);
                    saveData(); 
                }
            }

            document.getElementById('resultText').innerText = winner;
            document.getElementById('resultModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
            updateWheelUI(); 
        }
    </script>
</body>
</html>
