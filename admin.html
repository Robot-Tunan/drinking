<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后台配置 - 聚会幸运转盘</title>
    <style>
        :root {
            --primary-color: #e74c3c;
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-title {
            margin: 15px 0 30px 0;
            color: #ff7675;
            font-size: 26px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .settings-content {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #74b9ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #b2bec3;
        }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444; transition: .3s; border-radius: 34px;
        }
        .slider::before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider::before { transform: translateX(24px); }

        .status-bar {
            background-color: rgba(116, 185, 255, 0.1);
            border: 1px dashed #74b9ff;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            color: #74b9ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-primary { background-color: var(--primary-color); }
        .btn-danger { background-color: #d63031; }

        .options-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #1e1e1e;
        }

        .option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        .option-item:last-child { border-bottom: none; }
        .option-item.is-drawn {
            color: #666;
            text-decoration: line-through;
            background-color: rgba(0,0,0,0.15);
        }

        .delete-btn {
            background: none; border: none; color: #ff7675; cursor: pointer; font-size: 16px;
        }

        .grid-2 {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="page-title">⚙️ 幸运大转盘 - 实时后台配置</div>

    <div class="settings-content">
        <div class="card">
            <div class="card-title">基本信息</div>
            <div class="form-group">
                <label>转盘大标题</label>
                <input type="text" id="titleInput" placeholder="例如：今晚谁买单">
            </div>
            <div class="form-group">
                <label>转动持续时间 (秒)</label>
                <input type="number" id="durationInput" min="1" max="20" value="4">
            </div>
            <div class="form-group toggle-container" style="margin-top: 20px;">
                <div>
                    <label style="margin-bottom: 2px; color: #fff;">不重复抽取模式</label>
                    <span style="font-size: 12px; color: #888;">开启后，被抽中的规则将暂时从轮盘中滤除</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="noRepeatToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="status-bar" id="poolStatusBar" style="display: none;">
                <span id="poolStatusText">已淘汰：0 / 0 条规则</span>
                <button class="btn" style="padding: 4px 10px; font-size: 12px;" onclick="resetDrawnPool()">重置过滤池</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">批量追加新规则</div>
            <textarea id="batchInput" rows="4" placeholder="每行输入一条新规则，按回车换行..."></textarea>
            <button class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;" onclick="addBatchOptions()">⚡ 确认追加到规则库</button>
        </div>

        <div class="card">
            <div class="card-title">
                <span>当前规则库 (<span id="totalCount">0</span>)</span>
                <button class="btn btn-danger" style="padding: 4px 10px; font-size: 12px;" onclick="startNewWheel()">清空规则</button>
            </div>
            <div class="options-list" id="optionsList">
                </div>
            <div class="grid-2">
                <button class="btn" onclick="resetDefaults()">恢复初始100条</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        let wheelData = { title: "", duration: 4, noRepeat: false, options: [], drawnOptions: [] };

        let titleInput, durationInput, noRepeatToggle, poolStatusBar, poolStatusText, optionsList, batchInput, totalCountSpan;

        window.onload = function() {
            init();
        };

        function init() {
            titleInput = document.getElementById('titleInput');
            durationInput = document.getElementById('durationInput');
            noRepeatToggle = document.getElementById('noRepeatToggle');
            poolStatusBar = document.getElementById('poolStatusBar');
            poolStatusText = document.getElementById('poolStatusText');
            optionsList = document.getElementById('optionsList');
            batchInput = document.getElementById('batchInput');
            totalCountSpan = document.getElementById('totalCount');

            socket = io();
            bindEvents();
            
            socket.on('initData', (data) => {
                wheelData = data;
                updateSettingsUI();
            });

            socket.on('syncData', (data) => {
                wheelData = data;
                updateSettingsUI();
            });
        }

        function saveData() {
            if (socket) socket.emit('updateData', wheelData);
        }

        function bindEvents() {
            titleInput.addEventListener('input', (e) => {
                wheelData.title = e.target.value;
                saveData();
            });
            durationInput.addEventListener('change', (e) => {
                let val = parseInt(e.target.value);
                if(isNaN(val) || val < 1) val = 1;
                wheelData.duration = val;
                saveData();
            });
            noRepeatToggle.addEventListener('change', (e) => {
                wheelData.noRepeat = e.target.checked;
                saveData();
                updateSettingsUI();
            });
        }

        function updateSettingsUI() {
            if(!titleInput) return;

            titleInput.value = wheelData.title || '';
            durationInput.value = wheelData.duration || 4;
            noRepeatToggle.checked = !!wheelData.noRepeat;
            
            const totalOptCount = wheelData.options ? wheelData.options.length : 0;
            const drawnOptCount = wheelData.drawnOptions ? wheelData.drawnOptions.length : 0;
            totalCountSpan.innerText = totalOptCount;
            
            if (wheelData.noRepeat) {
                poolStatusBar.style.display = 'flex';
                poolStatusText.innerText = `已淘汰：${drawnOptCount} / ${totalOptCount} 条`;
            } else {
                poolStatusBar.style.display = 'none';
            }
            
            optionsList.innerHTML = '';
            if (wheelData.options) {
                wheelData.options.forEach((opt, index) => {
                    const isDrawn = wheelData.noRepeat && wheelData.drawnOptions && wheelData.drawnOptions.includes(opt);
                    const div = document.createElement('div');
                    div.className = `option-item ${isDrawn ? 'is-drawn' : ''}`;
                    div.innerHTML = `
                        <span>${opt} ${isDrawn ? '(已过滤)' : ''}</span>
                        <button class="delete-btn" onclick="removeOption(${index})">✖</button>
                    `;
                    optionsList.appendChild(div);
                });
            }
        }

        function addBatchOptions() {
            const text = batchInput.value.trim();
            if (!text) return;
            
            const newOptions = text.split('\n').map(item => item.trim()).filter(item => item !== '');
            if (newOptions.length > 0) {
                if (!wheelData.options) wheelData.options = [];
                wheelData.options = wheelData.options.concat(newOptions);
                batchInput.value = ''; 
                saveData();
                updateSettingsUI();
                alert(`成功追加 ${newOptions.length} 条新规则！`);
            }
        }

        function removeOption(index) {
            if(!wheelData.options || wheelData.options.length <= 1) {
                alert("至少保留一个选项！");
                return;
            }
            const removedOpt = wheelData.options.splice(index, 1)[0];
            if (wheelData.drawnOptions) {
                wheelData.drawnOptions = wheelData.drawnOptions.filter(opt => opt !== removedOpt);
            }
            saveData();
            updateSettingsUI();
        }

        function startNewWheel() {
            if(confirm("确定要开启新转盘吗？这将彻底清空当前所有的标题、规则和淘汰记录。")) {
                wheelData.title = "";
                wheelData.options = [];
                wheelData.drawnOptions = [];
                saveData();
                updateSettingsUI();
                alert("已开辟全新空转盘！");
            }
        }

        function resetDrawnPool() {
            wheelData.drawnOptions = [];
            saveData();
            updateSettingsUI();
            alert("已清空淘汰记录，所有指令重新归位。");
        }

        function resetDefaults() {
            if(confirm("确定要恢复到初始规则吗？")) {
                socket.emit('resetData');
                alert("已发送重置请求！");
            }
        }
    </script>
</body>
</html>
